<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Apage — 一个页面，干净打开">
  <title>Apage — 一个页面，干净打开</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1425"/>
      <stop offset="0.55" stop-color="#101C33"/>
      <stop offset="1" stop-color="#182743"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <ellipse cx="205" cy="215" rx="420" ry="300" fill="url(#glowA)"/>
  <ellipse cx="1140" cy="60" rx="360" ry="240" fill="url(#glowB)"/>

  <!-- tab-capsule motifs (brand metaphor: A + tab) -->
  <g fill="rgba(59,130,246,0.05)" stroke="rgba(111,168,255,0.14)" stroke-width="1.5">
    <rect x="905" y="58" width="196" height="46" rx="23"/>
    <rect x="1128" y="118" width="118" height="38" rx="19"/>
    <rect x="962" y="292" width="240" height="52" rx="26"/>
    <rect x="820" y="196" width="96" height="32" rx="16"/>
    <rect x="1160" y="238" width="86" height="30" rx="15"/>
  </g>
  <g stroke="rgba(111,168,255,0.10)" stroke-width="1.5" fill="none">
    <path d="M0 372 H 480"/>
    <path d="M560 372 H 1280"/>
  </g>

  <!-- brand logo (real apage-256.png, embedded) -->
  <image x="88" y="138" width="144" height="144" xlink:href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>

  <!-- wordmark + tagline -->
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Hiragino Sans GB, Arial, sans-serif">
    <text x="278" y="176" font-size="74" font-weight="700" fill="#F4F7FB" letter-spacing="1.5">Apage</text>
    <text x="280" y="228" font-size="27" fill="#BFD2F0" letter-spacing="4">一个页面，干净打开。</text>
    <text x="280" y="266" font-size="18.5" fill="#7E93B5" letter-spacing="1">超轻量 · 隐私优先 · 全本地化的 Windows 便携浏览器</text>

    <!-- feature pills -->
    <g font-size="16" letter-spacing="0.5">
      <rect x="278" y="292" width="172" height="38" rx="19" fill="rgba(59,130,246,0.15)" stroke="rgba(111,168,255,0.38)" stroke-width="1.2"/>
      <text x="364" y="317" text-anchor="middle" fill="#A9C8FF">≈4MB 单文件</text>

      <rect x="466" y="292" width="172" height="38" rx="19" fill="rgba(59,130,246,0.15)" stroke="rgba(111,168,255,0.38)" stroke-width="1.2"/>
      <text x="552" y="317" text-anchor="middle" fill="#A9C8FF">隐私默认全开</text>

      <rect x="654" y="292" width="230" height="38" rx="19" fill="rgba(59,130,246,0.15)" stroke="rgba(111,168,255,0.38)" stroke-width="1.2"/>
      <text x="769" y="317" text-anchor="middle" fill="#A9C8FF">零遥测 · 零后台请求</text>
    </g>

    <text x="1240" y="398" text-anchor="end" font-size="14" fill="#45577A" letter-spacing="0.5">github.com/Miasakiii/Apage · MIT Licensed</text>
  </g>
</svg>
